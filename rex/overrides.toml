# MoH: Airborne (default.xex, SHA-256 8050b225...) - manual declarations for the codegen.
#
# Included from airborne_manifest.toml. Included files use the flat schema
# (sections at the root), not the one nested under [entrypoint].

# ----------------------------------------------------------------------------
#  CODEGEN OPTIONS (root keys: they must stay above the first [table], or TOML
#  puts them inside it and the codegen ignores them silently)
#
#  Guest registers as C++ locals instead of PPCContext fields, so the host
#  compiler keeps them in registers. They pay off most on the Switch's slow
#  cores (NFSMW: ~14 % of its main thread was __savegprlr/__restgprlr alone).
#  Safe here because no hook of ours reads guest registers from the context.
#  Not enabled: non_argument_as_local (localizes r12, which __savevmx_N takes
#  as a base) and skip_lr.
# ----------------------------------------------------------------------------
cr_as_local = true
non_volatile_as_local = true
xer_as_local = true
ctr_as_local = true
# Volatile vector registers (v0-v13, v32-v63) as locals too, synchronized with the
# context at every call and return (AirborneNX codegen option): the VMX128 math
# loops (mixer, animation, matrices) stop going through memory per instruction.
volatile_vectors_as_local = true
# The same for the volatile integer and float registers (r0, r2-r12, f0-f13).
# Off: measured on the PC (Adanti, 60-90 s, active samples) it changed nothing.
volatile_as_local = false

# Generator passes of sa2-nx and masseffect-nx (their SDK's codegen, merged into
# tools/patches/rexglue-airborne.patch). They change how the C++ is written,
# not what the guest sees; both ports checked each one with unit tests and
# lockstep runs, and measured them on the console (Mass Effect: -10 % main
# thread for the first four, sa2-nx: about 15 % for the whole set).
#   elide_lr_stores   no `ctx.lr = <return>` before calls. No hook of ours
#                     reads ctx.lr (the one in native_hooks.cpp is compiled
#                     out), so lr_keep_returns stays empty.
#   dform_disp_split  D-form loads/stores as base + zext(reg) + disp.
#   fctiwz/fcti_inline  float to integer as fcvtzs plus a NaN select.
#   fp_*              float moves, compares and copies without switching the
#                     host float mode when no mode can matter.
#   rotate_word_shifts  rlwinm/rlwimi as the plain shift or extract.
#   div_inline        divw/divwu as the host instruction, no branch.
#   skip_msr, reserved_as_local  the guest atomic sequences without the
#                     mfmsr/mtmsrd fences and the global lock, the lwarx
#                     reservation in a local.
# Not taken: non_argument_as_local (needs share_registers marks for the
# exception funclets that take their frame in r12: tools/read_before_write.py
# of masseffect-nx lists ~100 here), args_in_registers (no gain in Mass
# Effect), dcbt_prefetch (no emitter in this generator).
elide_lr_stores = true
lr_keep_returns = []
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
fp_moves_modeless = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = false
fp_copy_pairs = true
fp_copy_forwarding = true
rotate_word_shifts = true
div_inline = true
skip_msr = true
reserved_as_local = true

# ----------------------------------------------------------------------------
#  FUNCTIONS DECLARED BY HAND
#
#  Key = start address. Without size/end the analyzer finds the bounds itself.
#  Each of these is reached only by a tail branch (b) from a this-adjusting
#  thunk, so the analysis never saw a bl to it ("target not in any function").
# ----------------------------------------------------------------------------
[functions]
# Leaf: squared distance of two float3 + fsqrts compare. Tail-called from 0x82DD9BD0.
"0x82CA6540" = {}
# Leaf getter: *r4 = this->field_0C; return 0. Tail-called from 0x82AA19E4 (r3 -= 4).
"0x82AA13A8" = {}
# Thunk: r3 += 4; b 0x82AA2C00. Tail-called from 0x82AABF6C (r3 -= 4).
"0x82AABB70" = {}
# Overrides of missed_functions.toml entries (this file is included after it):
# Exception funclet of 0x82DD1370, in its frame (r31): it branches back into
# the parent (b 0x82DD1400). The analysis also stopped after
# `bl 0x82C54E90` at 0x82DD14C4, leaving the beq target 0x82DD14C8 outside.
# It ends with `b 0x82C46ADC` (restore and return) before 0x82DD14E4.
"0x82DD148C" = { parent = 0x82DD1370, end = 0x82DD14E4, share_registers = true }

# ----------------------------------------------------------------------------
#  JUMP TABLES verified by tools/recover_airborne_switches.py (bytes checked
#  against default.xex). Keyed by the bctr address.
#  0x828B6D24: auto-detection reads 17 entries from the byte table; only 12
#  belong to it (indices 12..16 are the bytes after the table).
#  0x82CDD5B8: auto-detection agrees (16 halfword entries); pinned anyway.
# ----------------------------------------------------------------------------
[[switch_tables]]
address  = 0x828B6D24  # bctr; dispatch starts at 0x828B6D00
register = 3
labels   = [
    0x828B6D28,
    0x828B6D38,
    0x828B6D48,
    0x828B6D58,
    0x828B6D68,
    0x828B6D78,
    0x828B6D88,
    0x828B6D98,
    0x828B6DA8,
    0x828B6DB8,
    0x828B6DC8,
    0x828B6DD8,
]

[[switch_tables]]
address  = 0x82CDD5B8  # bctr; dispatch starts at 0x82CDD594
register = 24
labels   = [
    0x82CDD5BC,
    0x82CDD5BC,
    0x82CDD090,
    0x82CDD5BC,
    0x82CDD5BC,
    0x82CDD5BC,
    0x82CDD5BC,
    0x82CDD090,
    0x82CDD090,
    0x82CDD5BC,
    0x82CDD090,
    0x82CDD090,
    0x82CDD5BC,
    0x82CDD5BC,
    0x82CDD5BC,
    0x82CDD5BC,
]
